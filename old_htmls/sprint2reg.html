<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiók létrehozása</title>
    <link rel="stylesheet" href="../tokens.css">
    <link rel="stylesheet" href="sprint2reg.css">
</head>
<body>
    <div class="modal-container">
        <div class="modal-header">
            <div class="logo">
                <img src="regginlogo.png" alt="REGGIN Logo">
            </div>
            <button class="close-btn">&times;</button>
        </div>
        
        <h1 class="modal-title">Fiók létrehozása</h1>
        <p class="modal-subtitle">Regisztrálj az ajánlatainkhoz</p>
        
        <form class="register-form">
            <div class="input-row">
                <div class="input-group">
                    <label for="firstname">Keresztnév</label>
                    <input type="text" id="firstname" placeholder="Péter" required>
                </div>
                <div class="input-group">
                    <label for="lastname">Vezetéknév</label>
                    <input type="text" id="lastname" placeholder="Kovács" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">E-mail cím</label>
                <input type="email" id="email" placeholder="pelda@email.hu" required>
            </div>
            
            <div class="input-group">
                <label for="phone">Telefonszám</label>
                <input type="tel" id="phone" placeholder="+36 30 123 4567" required>
            </div>

            <div class="input-group">
                <label for="password">Jelszó</label>
                <input type="password" id="password" placeholder="........" required>
            </div>

            <div class="input-group">
                <label for="password_confirm">Jelszó megerősítése</label>
                <input type="password" id="password_confirm" placeholder="........" required>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">Elfogadom az <a href="#">Általános Szerződési Feltételeket</a> és az <a href="#">Adatvédelmi nyilatkozatot</a></label>
            </div>
            
            <button type="submit" class="submit-btn">Regisztráció</button>
        </form>
        
        <div class="modal-footer">
            Már van fiókod? <a href="sprint2log.html">Bejelentkezés</a>
        </div>
    </div>
</body>
</html>
