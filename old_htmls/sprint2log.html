<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bejelentkezés</title>
    <link rel="stylesheet" href="../tokens.css">
    <link rel="stylesheet" href="sprint2log.css">
</head>
<body>
    <div class="modal-container">
        <div class="modal-header">
            <div class="logo">
                <img src="regginlogo.png" alt="REGGIN Logo">
            </div>
            <button class="close-btn">&times;</button>
        </div>
        
        <h1 class="modal-title">Bejelentkezés</h1>
        
        <form class="login-form">
            <div class="input-group">
                <label for="email">E-mail cím</label>
                <input type="email" id="email" placeholder="pelda@email.hu" required>
            </div>
            
            <div class="input-group">
                <label for="password">Jelszó</label>
                <input type="password" id="password" placeholder="........" required>
            </div>
            
            <div class="forgot-password">
                <a href="#">Elfelejtett jelszó?</a>
            </div>
            
            <button type="submit" class="submit-btn">Bejelentkezés</button>
        </form>
        
        <div class="modal-footer">
            Még nincs fiókod? <a href="sprint2reg.html">Regisztráció</a>
        </div>
    </div>
</body>
</html>
